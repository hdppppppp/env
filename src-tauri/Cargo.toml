[package]
name = "env-manager"
version = "0.1.0"
description = "Environment variable manager - Rust backend with React GUI"
edition = "2021"

[lib]
name = "env_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "env-manager"
path = "src/main.rs"

[features]
# `cargo build --release --features custom-protocol` 打包内嵌前端资源（tauri CLI build 也会自动开启）
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
aes-gcm = "0.10"
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = "0.12"
rand_core = { version = "0.6", features = ["getrandom"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
panic = "abort"
